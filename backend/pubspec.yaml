name: dark_pulse_core
description: Serveur SDN et SIEM pour Dark Pulse.

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  shelf: ^1.4.1                 # Le framework serveur web (équivalent de Express.js)
  shelf_router: ^1.1.4          # Pour créer les routes API (/api/v1/...)
  shelf_web_socket: ^1.0.4      # Pour le flux de logs en direct
  web_socket_channel: ^2.4.0
  dart_jsonwebtoken: ^2.8.0     # Sécurité Zero Trust (JWT)
  sqlite3: ^2.4.2           # 👈 LE MOTEUR DE BASE DE DONNÉES
  path: ^1.9.0
  